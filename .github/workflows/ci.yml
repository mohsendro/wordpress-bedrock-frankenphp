name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:2

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: PHP syntax check
        run: find config web scripts -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Validate Docker Compose configurations
        run: |
          docker compose -f compose.yaml -f compose.frankenphp.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.php-fpm.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.production.yaml -f compose.production.frankenphp.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.production.yaml -f compose.production.php-fpm.yaml config >/dev/null

      - name: Build FrankenPHP image
        run: docker build --file docker/frankenphp/Dockerfile --tag wordpress-starter:frankenphp-ci .

      - name: Build PHP-FPM image
        run: docker build --file docker/php-fpm/Dockerfile --tag wordpress-starter:php-fpm-ci .
