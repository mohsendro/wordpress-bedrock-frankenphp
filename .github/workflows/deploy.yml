name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRANKENPHP_IMAGE: ghcr.io/mohsendro/wordpress-bedrock-frankenphp
  PHP_FPM_IMAGE: ghcr.io/mohsendro/wordpress-bedrock-php-fpm

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: PHP syntax check
        run: find config web scripts -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Build FrankenPHP image
        run: docker build --file docker/frankenphp/Dockerfile --tag starter-frankenphp:test .

      - name: Build PHP-FPM image
        run: docker build --file docker/php-fpm/Dockerfile --tag starter-php-fpm:test .

  build:
    name: Build and publish images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build FrankenPHP image
        run: |
          docker build \
            --file docker/frankenphp/Dockerfile \
            --build-arg PHP_VERSION=8.3 \
            --tag ${{ env.FRANKENPHP_IMAGE }}:${{ github.sha }} \
            .

      - name: Push FrankenPHP image
        run: docker push ${{ env.FRANKENPHP_IMAGE }}:${{ github.sha }}

      - name: Build PHP-FPM image
        run: |
          docker build \
            --file docker/php-fpm/Dockerfile \
            --build-arg PHP_VERSION=8.3 \
            --tag ${{ env.PHP_FPM_IMAGE }}:${{ github.sha }} \
            .

      - name: Push PHP-FPM image
        run: docker push ${{ env.PHP_FPM_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -eu
            cd /srv/apps/wordpress-bedrock-frankenphp
            git fetch --prune origin main
            git reset --hard origin/main
            export IMAGE_TAG=${{ github.sha }}
            ./scripts/deploy.sh
