name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRANKENPHP_IMAGE: ghcr.io/mohsendro/wordpress-bedrock-frankenphp
  PHP_FPM_IMAGE: ghcr.io/mohsendro/wordpress-bedrock-php-fpm
  APP_DIR: /srv/apps/wordpress-bedrock-frankenphp

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:2

      - name: Validate Composer manifest
        run: composer validate

      - name: Install dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: PHP syntax check
        run: find config web scripts -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Build FrankenPHP image
        run: docker build --file docker/frankenphp/Dockerfile --tag starter-frankenphp:test .

      - name: Build PHP-FPM image
        run: docker build --file docker/php-fpm/Dockerfile --tag starter-php-fpm:test .

  build:
    name: Build and publish images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build FrankenPHP image
        run: |
          docker build \
            --file docker/frankenphp/Dockerfile \
            --build-arg PHP_VERSION=8.3 \
            --tag ${{ env.FRANKENPHP_IMAGE }}:${{ github.sha }} \
            .

      - name: Push FrankenPHP image
        run: docker push ${{ env.FRANKENPHP_IMAGE }}:${{ github.sha }}

      - name: Build PHP-FPM image
        run: |
          docker build \
            --file docker/php-fpm/Dockerfile \
            --build-arg PHP_VERSION=8.3 \
            --tag ${{ env.PHP_FPM_IMAGE }}:${{ github.sha }} \
            .

      - name: Push PHP-FPM image
        run: docker push ${{ env.PHP_FPM_IMAGE }}:${{ github.sha }}

  provision:
    name: Provision production server
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker and provision base server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          fingerprint: ${{ secrets.PRODUCTION_HOST_FINGERPRINT }}
          script_path: scripts/server-bootstrap.sh
          command_timeout: 15m

  deploy:
    name: Deploy production
    needs: provision
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
      DEPLOY_SHA: ${{ github.sha }}
      GHCR_TOKEN: ${{ github.token }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY }}
          PRODUCTION_ENV: ${{ env.PRODUCTION_ENV }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          GHCR_TOKEN: ${{ env.GHCR_TOKEN }}
          GHCR_USER: ${{ env.GHCR_USER }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          fingerprint: ${{ secrets.PRODUCTION_HOST_FINGERPRINT }}
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY,PRODUCTION_ENV,DEPLOY_SHA,GHCR_TOKEN,GHCR_USER,APP_DIR
          command_timeout: 20m
          script: |
            set -eu

            AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            mkdir -p "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone "https://github.com/$GITHUB_REPOSITORY.git" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --prune origin main
            git reset --hard origin/main

            printf '%s\n' "$PRODUCTION_ENV" > .env
            chmod 600 .env

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

            export IMAGE_TAG="$DEPLOY_SHA"
            ./scripts/deploy.sh
