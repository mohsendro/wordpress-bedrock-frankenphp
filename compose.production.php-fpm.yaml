services:
  app:
    image: ghcr.io/mohsendro/wordpress-bedrock-php-fpm:${IMAGE_TAG}
    build: null
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wp_content:/app/web/app
    restart: always

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - wp_content:/app/web/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

  wp-cli:
    image: ghcr.io/mohsendro/wordpress-bedrock-php-fpm:${IMAGE_TAG}
    build: null
    working_dir: /app
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wp_content:/app/web/app
    entrypoint: ["/usr/local/bin/wp-entrypoint"]
    command: ["wp"]
    profiles: ["tools"]

volumes:
  wp_content:
