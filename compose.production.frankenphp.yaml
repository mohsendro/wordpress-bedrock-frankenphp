services:
  app:
    image: ghcr.io/mohsendro/wordpress-bedrock-frankenphp:${IMAGE_TAG}
    build: null
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP3_PORT:-443}:443/udp"
    volumes:
      - uploads:/app/web/app/uploads
      - caddy_data:/data
      - caddy_config:/config
    restart: always

  wp-cli:
    image: ghcr.io/mohsendro/wordpress-bedrock-frankenphp:${IMAGE_TAG}
    build: null
    volumes:
      - ./:/app
      - uploads:/app/web/app/uploads
    profiles: ["tools"]
