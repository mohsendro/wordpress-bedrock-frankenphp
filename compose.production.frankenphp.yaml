services:
  app:
    image: ghcr.io/mohsendro/wordpress-bedrock-frankenphp:${IMAGE_TAG}
    env_file:
      - .env
    environment:
      FRANKENPHP_MODE: ${FRANKENPHP_MODE:-classic}
      FRANKENPHP_WORKERS: ${FRANKENPHP_WORKERS:-4}
      FRANKENPHP_MAX_REQUESTS: ${FRANKENPHP_MAX_REQUESTS:-500}
      SERVER_NAME: "${SERVER_NAME:-:80}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP3_PORT:-443}:443/udp"
    volumes:
      - wp_content:/app/web/app
      - caddy_data:/data
      - caddy_config:/config
    restart: always

  wp-cli:
    image: ghcr.io/mohsendro/wordpress-bedrock-frankenphp:${IMAGE_TAG}
    build: null
    working_dir: /app
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - wp_content:/app/web/app
    entrypoint: ["/usr/local/bin/wp-entrypoint"]
    command: ["wp"]
    profiles: ["tools"]

volumes:
  wp_content:
