services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    env_file:
      - .env
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}
      FRANKENPHP_MODE: ${FRANKENPHP_MODE:-classic}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP3_PORT:-443}:443/udp"
    volumes:
      - uploads:/app/web/app/uploads
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
