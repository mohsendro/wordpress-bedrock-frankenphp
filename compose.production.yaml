services:
  app:
    image: ghcr.io/mohsendro/wordpress-bedrock-frankenphp:${IMAGE_TAG}
    build: null
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - uploads:/app/web/app/uploads
    restart: unless-stopped

  wp-cli:
    profiles: ["tools"]
    volumes:
      - uploads:/app/web/app/uploads
